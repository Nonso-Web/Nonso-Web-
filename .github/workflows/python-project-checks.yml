name: Python portfolio checks

on:
  push:
    branches: [main]
    paths:
      - "projects/**"
      - ".github/workflows/python-project-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects/**"
      - ".github/workflows/python-project-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-projects:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - water-demand-forecasting
          - water-quality-monitoring
          - construction-carbon-estimator
          - infrastructure-incident-analytics
          - pump-failure-classification
          - public-spending-transparency

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/${{ matrix.project }}/requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r projects/${{ matrix.project }}/requirements.txt

      - name: Compile Python source
        run: python -m compileall -q projects/${{ matrix.project }}/src

      - name: Validate notebook JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          project = Path("projects") / "${{ matrix.project }}"
          notebooks = list((project / "notebooks").glob("*.ipynb"))
          if not notebooks:
              raise SystemExit("No notebook found")
          for notebook in notebooks:
              data = json.loads(notebook.read_text(encoding="utf-8"))
              if data.get("nbformat") != 4 or not isinstance(data.get("cells"), list):
                  raise SystemExit(f"Invalid notebook structure: {notebook}")
              print(f"Validated {notebook}")
          PY

      - name: Run project analysis
        run: python projects/${{ matrix.project }}/src/${{ matrix.project == 'pump-failure-classification' && 'train_model.py' || matrix.project == 'public-spending-transparency' && 'analyse_procurement.py' || 'analysis.py' }}
